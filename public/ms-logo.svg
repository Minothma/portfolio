<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="msGradPrecise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  {/* Squircle Dark Card */}
  <rect width="100" height="100" rx="22" fill="#11161d" />
  <rect x="0.8" y="0.8" width="98.4" height="98.4" rx="21.2" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.2" />

  {/* Precise Geometric M Structure */}
  <g stroke="url(#msGradPrecise)" stroke-width="6.6" stroke-linejoin="miter" stroke-miterlimit="4" fill="none">
    {/* Left Hollow Stem of M (Outer -> Bottom -> Inner) */}
    <path d="M 17 20 L 17 86 L 33 86 L 33 39" stroke-linecap="square" />

    {/* M Center V and Right Top Triangle with shortened right leg */}
    <path d="M 17 20 L 50 60 L 80 20 L 80 58" stroke-linecap="square" />

    {/* Flowing Interconnected S */}
    <path
      d="M 64 20 C 46 17, 36 26, 38 38 C 40 50, 75 48, 77 64 C 79 79, 58 87, 38 74"
      stroke-linecap="round"
    />
  </g>
</svg>
